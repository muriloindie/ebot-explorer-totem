<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f97316" />
    <title>Ebot Explorer Totem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />

    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite">
      <div class="ambient-map" aria-hidden="true"></div>
      <header id="navbar" class="kiosk-nav"></header>
      <main id="screen" class="screen-host" tabindex="-1"></main>
      <aside id="assistant" class="assistant-dock" aria-label="Ebot assistant"></aside>
      <section id="keyboard" class="keyboard-panel" aria-label="Virtual keyboard"></section>
      <section id="modal" class="modal-layer" aria-live="assertive"></section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <script src="data/settings.js"></script>
    <script src="data/i18n.js"></script>
    <script src="data/tags.js"></script>
    <script src="data/places.js"></script>
    <script src="data/routes.js"></script>
    <script src="data/commands.js"></script>

    <script src="js/utils.js"></script>
    <script src="js/state.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/assistant.js"></script>
    <script src="js/search.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/map.js"></script>
    <script src="js/keyboard.js"></script>

    <script src="js/timeout.js"></script>
